<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Symmetry Span</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Symmetry Span</h1>
        <p class="subtitle">Task display</p>

        <div class="grid-layout">
          <div class="box">
            <h2>Symmetry Grid</h2>
            <div id="symmetry-output"></div>
          </div>

          <div class="box">
            <h2>Memory Grid</h2>
            <div id="memory-output"></div>
          </div>
        </div>

        <div class="meta">
          <span class="badge" id="trial-label">Trial 1</span>
          <span class="badge" id="category-label">Category: Loading</span>
          <span class="badge" id="sequence-label">Sequence: 0</span>
        </div>

        <div id="status" class="status">Preparing stimulus…</div>
        <div id="recall-panel" class="recall-panel"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
